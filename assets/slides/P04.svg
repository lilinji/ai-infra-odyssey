<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', sans-serif" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF"/><g id="system-header" data-pptx-bounds="60 20 1160 30" data-pptx-role="decoration"><line x1="60" x2="1220" y1="45" y2="45" stroke="#DEE2E6" stroke-width="1"/><text x="60" y="35" fill="#0038FF" font-size="11" font-weight="700" letter-spacing="1">03 / KERNEL ENGINEERING</text><text x="250" y="35" fill="#6C757D" font-size="11">|</text><text x="265" y="35" fill="#0B0D12" font-size="11" font-weight="700">算子极致熔炉</text><text x="1220" y="35" fill="#6C757D" font-size="11" font-weight="700" text-anchor="end">SRAM TILING &amp; WARP-SPECIALIZATION</text></g><g id="title-block" data-pptx-bounds="60 55 1160 70"><text x="60" y="85" fill="#0B0D12" font-size="28" font-weight="900">算子熔炉调优：FlashAttention-2/3 与 SRAM Tiling</text><text x="60" y="112" fill="#495057" font-size="14">突破 HBM 访存墙瓶颈，利用片上 SRAM Tiling 与 Warp-Specialization 实现 72%+ 的 Tensor Core 极限吞吐</text></g><g id="left-memory-wall" data-pptx-bounds="60 135 520 525"><rect width="520" height="525" x="60" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="520" height="4" x="60" y="135" fill="#0B0D12"/><text x="90" y="170" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">IO COMPLEXITY PARADIGM</text><text x="90" y="200" fill="#0B0D12" font-size="20" font-weight="900">标准 Attention 访存墙 vs 片上 SRAM 融合</text><line x1="90" x2="550" y1="218" y2="218" stroke="#DEE2E6" stroke-width="1"/><rect width="460" height="150" x="90" y="235" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><text x="110" y="265" fill="#E53935" font-size="14" font-weight="700">传统标准 Attention 访存瓶颈 (Memory-Bound)</text><text x="110" y="290" fill="#495057" font-size="13">计算流：S = Q·K^T → P = softmax(S) → O = P·V</text><text x="110" y="315" fill="#495057" font-size="13">• 中间矩阵 S, P 尺寸为 N×N，必须频繁往返读写 HBM 显存<tspan x="110" dy="23">• 显存读写复杂度为 O(N^2)，导致长序列下显存迅速爆仓</tspan></text><text x="110" y="365" fill="#E53935" font-size="12" font-weight="700">❌ 算力空转：Tensor Core 计算利用率不足理论峰值的 20%</text><rect width="460" height="160" x="90" y="405" fill="#FFF" stroke="#0038FF" stroke-width="1.5"/><text x="110" y="435" fill="#0038FF" font-size="14" font-weight="700">FlashAttention 片上 Tiling 破局 (Compute-Bound)</text><text x="110" y="460" fill="#0B0D12" font-size="13">核心机制：基于 SRAM 块大小 (B_c, B_r) 对 Q/K/V 严格分块</text><text x="110" y="485" fill="#495057" font-size="13">• Online Softmax：动态局部更新最大值 m 与归一化和 l<tspan x="110" dy="23">• N×N 分数矩阵永不落盘 HBM，全局显存 IO 直降至 O(N)</tspan></text><text x="110" y="540" fill="#0038FF" font-size="12" font-weight="700">✓ 硬件利用率跃迁：Tensor Core 实际效能飙升至 72%+</text><rect width="460" height="50" x="90" y="585" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><text x="110" y="615" fill="#0038FF" font-size="12" font-weight="700">首创手撕 CUDA 原生算子，全面适配各种异构硬件与超长序列</text></g><g id="right-evolution-steps" data-pptx-bounds="600 135 620 525"><rect width="620" height="525" x="600" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="620" height="4" x="600" y="135" fill="#0038FF"/><text x="630" y="170" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">ARCHITECTURAL EVOLUTION</text><text x="630" y="200" fill="#0B0D12" font-size="20" font-weight="900">FlashAttention 1 → 2 → 3 演进与硬件特化</text><line x1="630" x2="1190" y1="218" y2="218" stroke="#DEE2E6" stroke-width="1"/><rect width="560" height="90" x="630" y="235" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><rect width="4" height="90" x="630" y="235" fill="#6C757D"/><text x="650" y="262" fill="#0B0D12" font-size="15" font-weight="900">FlashAttention-1：分块 Tiling 与重计算范式创立</text><text x="650" y="287" fill="#495057" font-size="13">引入片上 SRAM 分块加载与 Online Softmax 动态累积算法；<tspan x="650" dy="21">反向传播舍弃保存 N×N 矩阵，通过重计算以 30% 算力换取显存降低 80%。</tspan></text><rect width="560" height="110" x="630" y="345" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><rect width="4" height="110" x="630" y="345" fill="#0038FF"/><text x="650" y="372" fill="#0038FF" font-size="15" font-weight="900">FlashAttention-2：循环逆序优化与并行度最大化</text><text x="650" y="397" fill="#495057" font-size="13">外层遍历 Q 矩阵、内层遍历 KV 矩阵，避免频繁中间缩放与原子写回；<tspan x="650" dy="21">在 Sequence 维度与 Batch 维度跨 ThreadBlock 全并行切分；</tspan><tspan x="650" dy="21">消除非必要同步指令，硬件 MFU 提升至 55%~65%。</tspan></text><rect width="560" height="160" x="630" y="475" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><rect width="4" height="160" x="630" y="475" fill="#0B0D12"/><text x="650" y="502" fill="#0B0D12" font-size="15" font-weight="900">FlashAttention-3：Warp-Specialization 与 TMA 硬件流水</text><text x="650" y="527" fill="#495057" font-size="13">深度融合 Hopper 微架构新特性：<tspan x="650" dy="23">• 生产者 Warp 专注 TMA 异步多维张量搬运，消费者 Warp 持续计算</tspan><tspan x="650" dy="22">• Ping-Pong 双缓冲异步流水线，消除指令等待与访存气泡</tspan><tspan x="650" dy="23">• FP8 低精度 Tensor Core 原生支持，吞吐达到恐怖的 72%+ 极限效能</tspan></text><text x="650" y="620" fill="#0038FF" font-size="12" font-weight="700">✓ 算子层面完全榨干片上 SRAM 与 Tensor Core 极限潜能</text></g><g id="system-footer" data-pptx-bounds="60 680 1160 30" data-pptx-role="decoration"><line x1="60" x2="1220" y1="685" y2="685" stroke="#DEE2E6" stroke-width="1"/><text x="60" y="703" fill="#6C757D" font-size="11">ENTERPRISE LARGE MODEL COMPUTING PLATFORM DELIVERY REPORT</text><text x="1220" y="703" fill="#0B0D12" font-size="11" font-weight="700" text-anchor="end">04 / 09</text></g></svg>