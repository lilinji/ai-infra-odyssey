    <!-- Card 1: MFU -->
    <rect x="580" y="75" width="310" height="280" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="580" y="75" width="310" height="4" fill="#0038FF"/>
    <text x="610" y="115" font-size="12" font-weight="700" fill="#6C757D" letter-spacing="1">01 / CLUSTER EFFICIENCY</text>
    <text x="610" y="175" font-size="52" font-weight="900" fill="#0038FF">62.8%</text>
    <text x="610" y="215" font-size="16" font-weight="700" fill="#0B0D12">万卡集群有效算力 (MFU)</text>
    <line x1="610" y1="235" x2="860" y2="235" stroke="#DEE2E6" stroke-width="1"/>
    <text x="610" y="265" font-size="13" fill="#495057">突破万卡规模扩展性悬崖<tspan x="610" dy="25">较业内基线 38.5% 大幅跃升 +63.1%</tspan></text>
    <text x="610" y="325" font-size="12" font-weight="700" fill="#0038FF">✓ 达到全球顶级超算利用率基线</text>

    <!-- Card 2: Serving Latency -->
    <rect x="910" y="75" width="310" height="280" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="910" y="75" width="310" height="4" fill="#0B0D12"/>
    <text x="940" y="115" font-size="12" font-weight="700" fill="#6C757D" letter-spacing="1">02 / SERVING LATENCY</text>
    <text x="940" y="175" font-size="52" font-weight="900" fill="#0B0D12">280ms</text>
    <text x="940" y="215" font-size="16" font-weight="700" fill="#0B0D12">在线推理 P99 尾部延迟</text>
    <line x1="940" y1="235" x2="1190" y2="235" stroke="#DEE2E6" stroke-width="1"/>
    <text x="940" y="265" font-size="13" fill="#495057">PagedAttention 治理显存碎片<tspan x="940" dy="25">PD 节点物理解耦，尾部延迟降 77.4%</tspan></text>
    <text x="940" y="325" font-size="12" font-weight="700" fill="#0B0D12">✓ 严苛长尾业务 SLO 100% 履约</text>

    <!-- Card 3: Self-Healing MTTR -->
    <rect x="580" y="380" width="310" height="280" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="580" y="380" width="310" height="4" fill="#0B0D12"/>
    <text x="610" y="420" font-size="12" font-weight="700" fill="#6C757D" letter-spacing="1">03 / HIGH AVAILABILITY</text>
    <text x="610" y="480" font-size="52" font-weight="900" fill="#0B0D12">98s</text>
    <text x="610" y="520" font-size="16" font-weight="700" fill="#0B0D12">节点故障全自动自愈 (MTTR)</text>
    <line x1="610" y1="540" x2="860" y2="540" stroke="#DEE2E6" stroke-width="1"/>
    <text x="610" y="570" font-size="13" fill="#495057">XID 异常秒级捕获 + 不良卡隔离<tspan x="610" dy="25">3FS 百 GB Checkpoint 瞬时热加载</tspan></text>
    <text x="610" y="630" font-size="12" font-weight="700" fill="#0B0D12">✓ 告别 45min 传统人工停机介入</text>

    <!-- Card 4: Architecture Completeness -->
    <rect x="910" y="380" width="310" height="280" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="910" y="380" width="310" height="4" fill="#0038FF"/>
    <text x="940" y="420" font-size="12" font-weight="700" fill="#6C757D" letter-spacing="1">04 / ASSETS DELIVERED</text>
    <text x="940" y="480" font-size="52" font-weight="900" fill="#0038FF">44+5</text>
    <text x="940" y="520" font-size="16" font-weight="700" fill="#0B0D12">万字核心讲义 + 生产 Capstone</text>
    <line x1="940" y1="540" x2="1190" y2="540" stroke="#DEE2E6" stroke-width="1"/>
    <text x="940" y="570" font-size="13" fill="#495057">从单卡算子到调度 RFC 生产级验证<tspan x="940" dy="25">形成万卡 AI Infra 完整工业资产库</tspan></text>
    <text x="940" y="630" font-size="12" font-weight="700" fill="#0038FF">✓ 工业级全套知识与代码全部结项</text>
