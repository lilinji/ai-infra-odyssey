    <text x="60" y="35" font-size="11" font-weight="700" fill="#0038FF" letter-spacing="1">AI INFRASTRUCTURE ODYSSEY</text>
    <text x="245" y="35" font-size="11" fill="#6C757D">|</text>
    <text x="260" y="35" font-size="11" font-weight="700" fill="#0B0D12">ENTERPRISE DELIVERY REPORT</text>
    <text x="1220" y="35" font-size="11" font-weight="700" fill="#0038FF" text-anchor="end">PRODUCTION GRADE · 100% VERIFIED</text>
  </g>

  <!-- Left Hero Presentation Block -->
  <g id="hero-section" data-pptx-bounds="60 75 490 585">
    <rect x="60" y="75" width="490" height="585" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    
    <!-- Accent Line -->
    <rect x="60" y="75" width="6" height="585" fill="#0038FF"/>

    <text x="95" y="125" font-size="12" font-weight="700" fill="#0038FF" letter-spacing="1.5">CAPSTONE DELIVERY · FINAL STAGE</text>
    
    <text x="95" y="175" font-size="36" font-weight="900" fill="#0B0D12">企业级大模型<tspan x="95" dy="48">算力平台交付汇报</tspan></text>
    
    <text x="95" y="270" font-size="18" font-weight="700" fill="#0038FF">全栈工程体系建设与生产级验收闭环</text>

    <line x1="95" y1="295" x2="510" y2="295" stroke="#DEE2E6" stroke-width="1"/>

    <text x="95" y="330" font-size="14" fill="#495057">基于第一性原理，贯穿物理微架构、算子极致熔炉、<tspan x="95" dy="25">分布式训练 3D+MoE 并行与在线推理 PD 解耦架构，</tspan><tspan x="95" dy="25">提供百秒级自愈与万卡 62.8% MFU 的高可用算力底座。</tspan></text>

    <!-- Meta Details Grid -->
    <rect x="95" y="420" width="415" height="205" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    
    <text x="120" y="455" font-size="12" font-weight="700" fill="#6C757D">交付规格</text>
    <text x="120" y="480" font-size="15" font-weight="700" fill="#0B0D12">万卡超算集群 (10,000+ GPUs)</text>
    
    <line x1="120" y1="500" x2="485" y2="500" stroke="#E9ECEF" stroke-width="1"/>

    <text x="120" y="530" font-size="12" font-weight="700" fill="#6C757D">技术覆盖</text>
    <text x="120" y="555" font-size="15" font-weight="700" fill="#0B0D12">9 大系统分篇 · 44 篇讲义 + 5 大 Capstone</text>

    <line x1="120" y1="575" x2="485" y2="575" stroke="#E9ECEF" stroke-width="1"/>

    <text x="120" y="605" font-size="12" font-weight="700" fill="#6C757D">验收结论</text>
    <text x="485" y="605" font-size="14" font-weight="900" fill="#0038FF" text-anchor="end">全部 KPI 100% 达标通过</text>
  </g>

