2k</text><rect width="40" height="150" x="340" y="430" fill="#0038FF"/><text x="360" y="420" fill="#0038FF" font-size="13" font-weight="700" text-anchor="middle">12.6k</text><text x="337" y="605" fill="#0B0D12" font-size="13" font-weight="700" text-anchor="middle">推理并发吞吐</text><rect width="40" height="102" x="440" y="478" fill="#495057"/><text x="460" y="468" fill="#495057" font-size="12" text-anchor="middle">31.8%</text><rect width="40" height="308" x="485" y="272" fill="#0038FF"/><text x="505" y="262" fill="#0038FF" font-size="13" font-weight="700" text-anchor="middle">96.2%</text><text x="482" y="605" fill="#0B0D12" font-size="13" font-weight="700" text-anchor="middle">显存有效利用率</text><rect width="40" height="13" x="585" y="567" fill="#495057"/><text x="605" y="557" fill="#495057" font-size="12" text-anchor="middle">1.0x</text><rect width="40" height="175" x="630" y="405" fill="#0038FF"/><text x="650" y="395" fill="#0038FF" font-size="13" font-weight="700" text-anchor="middle">27.5x</text><text x="627" y="605" fill="#0B0D12" font-size="13" font-weight="700" text-anchor="middle">自愈恢复提速比</text><text x="85" y="640" fill="#6C757D" font-size="11">注：测试基准基于万卡真实业务负载仿真，包含 70B/405B 全量参数混合并行与动态批推理压测。</text></g><g id="right-metric-cards" data-pptx-bounds="810 135 410 525"><rect width="410" height="525" x="810" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="410" height="4" x="810" y="135" fill="#0B0D12"/><text x="835" y="170" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">QUANTIFIED BUSINESS VALUE</text><text x="835" y="200" fill="#0B0D12" font-size="20" font-weight="900">工程交付量化突破与收益</text><line x1="835" x2="1195" y1="218" y2="218" stroke="#DEE2E6" stroke-width="1"/><rect width="360" height="85" x="835" y="235" fill="#FFF" stroke="#DEE2E6" stroke-width="1"/><text x="855" y="260" fill="#6C757D" font-size="11" font-weight="700">万卡有效算力提升 (MFU)</text><text x="855" y="295" fill="#0038FF" font-size="28" font-weight="900">+63.1%</text><text 