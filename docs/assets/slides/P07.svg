<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', sans-serif" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF"/><g id="system-header" data-pptx-bounds="60 20 1160 30" data-pptx-role="decoration"><line x1="60" x2="1220" y1="45" y2="45" stroke="#DEE2E6" stroke-width="1"/><text x="60" y="35" fill="#0038FF" font-size="11" font-weight="700" letter-spacing="1">06 / BENCHMARK &amp; PRODUCTION METRICS</text><text x="320" y="35" fill="#6C757D" font-size="11">|</text><text x="335" y="35" fill="#0B0D12" font-size="11" font-weight="700">生产环境性能实测对比</text><text x="1220" y="35" fill="#6C757D" font-size="11" font-weight="700" text-anchor="end">NATIVE EDITABLE DATA CHART</text></g><g id="title-block" data-pptx-bounds="60 55 1160 70"><text x="60" y="85" fill="#0B0D12" font-size="28" font-weight="900">生产基准评测：集群 MFU 与端到端延迟对比</text><text x="60" y="112" fill="#495057" font-size="14">万卡集群训练 MFU 提升至 62.8%，在线推理 P99 延迟降低 77.4%，全链路性能达标世界级工业标准</text></g><g id="column_chart" data-pptx-bounds="60 135 730 525" data-pptx-native-authority="json" data-pptx-replace-with="chart"><metadata type="application/json">{ &quot;name&quot;: &quot;benchmark_chart&quot;, &quot;x&quot;: 60, &quot;y&quot;: 135, &quot;width&quot;: 730, &quot;height&quot;: 525, &quot;type&quot;: &quot;column&quot;, &quot;categories&quot;: [&quot;万卡 MFU 算力 (%)&quot;, &quot;推理吞吐 (k tok/s)&quot;, &quot;显存利用率 (%)&quot;, &quot;自愈加速比 (倍)&quot;], &quot;series&quot;: [ {&quot;name&quot;: &quot;传统开源基线 (Baseline)&quot;, &quot;values&quot;: [38.5, 4.2, 31.8, 1.0]}, {&quot;name&quot;: &quot;平台交付达标 (Optimized)&quot;, &quot;values&quot;: [62.8, 12.6, 96.2, 27.5]} ], &quot;style&quot;: {&quot;colors&quot;: [&quot;#495057&quot;, &quot;#0038FF&quot;]} }</metadata><rect width="730" height="525" x="60" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="730" height="4" x="60" y="135" fill="#0038FF"/><text x