<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content"
     font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Top System Header Bar -->
  <g id="system-header" data-pptx-bounds="60 20 1160 30" data-pptx-role="decoration">
    <line x1="60" y1="45" x2="1220" y2="45" stroke="#DEE2E6" stroke-width="1"/>
    <text x="60" y="35" font-size="11" font-weight="700" fill="#0038FF" letter-spacing="1">01 / HARDWARE &amp; INTERCONNECT</text>
    <text x="280" y="35" font-size="11" fill="#6C757D">|</text>
    <text x="295" y="35" font-size="11" font-weight="700" fill="#0B0D12">万卡物理网络基础设施</text>
    <text x="1220" y="35" font-size="11" font-weight="700" fill="#6C757D" text-anchor="end">TOPOLOGY ARCHITECTURE</text>
  </g>

  <!-- Title & Core Message -->
  <g id="title-block" data-pptx-bounds="60 55 1160 70">
    <text x="60" y="85" font-size="28" font-weight="900" fill="#0B0D12">物理微架构与万卡超算互联拓扑</text>
    <text x="60" y="112" font-size="14" fill="#495057">以物理第一性原理消除通信悬崖，构建 8×800G OSFP 机间双轨拓扑与 900GB/s 机内对分互联</text>
  </g>

  <!-- 3-Column Swiss Grid Layout -->
  <g id="three-columns" data-pptx-bounds="60 135 1160 525">
    <!-- Col 1: Silicon Microarchitecture -->
    <rect x="60" y="135" width="365" height="525" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="60" y="135" width="365" height="4" fill="#0B0D12"/>
    
    <text x="85" y="170" font-size="12" font-weight="700" fill="#0038FF" letter-spacing="1">TIER 1 · SILICON BASELINE</text>
    <text x="85" y="200" font-size="20" font-weight="900" fill="#0B0D12">单卡硬件微架构与片上机制</text>
    <line x1="85" y1="218" x2="400" y2="218" stroke="#DEE2E6" stroke-width="1"/>

    <!-- Key Spec Callout -->
    <rect x="85" y="235" width="315" height="75" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="105" y="265" font-size="11" font-weight="700" fill="#6C757D">HBM3e MEMORY BANDWIDTH</text>
    <text x="105" y="295" font-size="28" font-weight="900" fill="#0B0D12">3.35 TB/s</text>
    <text x="245" y="295" font-size="12" fill="#0038FF" font-weight="700">· 击破内存墙</text>

    <!-- Point 1 -->
    <text x="85" y="340" font-size="15" font-weight="700" fill="#0B0D12">1. SM 与 Tensor Core 算力调度</text>
    <text x="85" y="365" font-size="13" fill="#495057">132 个 SM 单元深度并行，Warp 级指令发射；<tspan x="85" dy="23">支持 FP8 稠密与稀疏加速，压榨每瓦最高算力。</tspan></text>

    <!-- Point 2 -->
    <text x="85" y="430" font-size="15" font-weight="700" fill="#0B0D12">2. TMA 异步多维张量搬运</text>
    <text x="85" y="455" font-size="13" fill="#495057">硬件级 Tensor Memory Accelerator，<tspan x="85" dy="23">实现 Global Memory 到 Shared Memory 零寄存器开销搬运。</tspan></text>

    <!-- Point 3 -->
    <text x="85" y="520" font-size="15" font-weight="700" fill="#0B0D12">3. 片上分布式 Shared Memory</text>
    <text x="85" y="545" font-size="13" fill="#495057">支持跨 SM 共享内存协同，构筑高吞吐低延迟算子底座。</text>

    <rect x="85" y="590" width="315" height="45" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="100" y="618" font-size="12" font-weight="700" fill="#0038FF">✓ 硬件峰值浮点算力与访存极限充分释放</text>

    <!-- Col 2: Intra-Node NVLink -->
    <rect x="455" y="135" width="365" height="525" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="455" y="135" width="365" height="4" fill="#0038FF"/>
    
    <text x="480" y="170" font-size="12" font-weight="700" fill="#0038FF" letter-spacing="1">TIER 2 · INTRA-NODE FABRIC</text>
    <text x="480" y="200" font-size="20" font-weight="900" fill="#0B0D12">8-GPU NVLink 4.0 全互联</text>
    <line x1="480" y1="218" x2="795" y2="218" stroke="#DEE2E6" stroke-width="1"/>

    <!-- Key Spec Callout -->
    <rect x="480" y="235" width="315" height="75" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="500" y="265" font-size="11" font-weight="700" fill="#6C757D">BIDIRECTIONAL BISECTION BANDWIDTH</text>
    <text x="500" y="295" font-size="28" font-weight="900" fill="#0038FF">900 GB/s</text>
    <text x="640" y="295" font-size="12" fill="#0038FF" font-weight="700">· 任意单跳直通</text>

    <!-- Point 1 -->
    <text x="480" y="340" font-size="15" font-weight="700" fill="#0B0D12">1. 4× NVSwitch 物理全交换</text>
    <text x="480" y="365" font-size="13" fill="#495057">单机 8 张 GPU 任意两两无阻塞直通通信，<tspan x="480" dy="23">彻底消除传统 PCIe 桥接瓶颈与跨 NUMA 延迟。</tspan></text>

    <!-- Point 2 -->
    <text x="480" y="430" font-size="15" font-weight="700" fill="#0B0D12">2. 全局统一内存编址与直接存取</text>
    <text x="480" y="455" font-size="13" fill="#495057">支持跨卡 Load/Store 原语，为张量并行 (TP)<tspan x="480" dy="23">提供媲美片内总线的极速大吞吐通信底座。</tspan></text>

    <!-- Point 3 -->
    <text x="480" y="520" font-size="15" font-weight="700" fill="#0B0D12">3. 网内聚合 SHARP 协议支持</text>
    <text x="480" y="545" font-size="13" fill="#495057">硬件级直接承载 AllReduce 归约计算，降低跨卡通信量。</text>

    <rect x="480" y="590" width="315" height="45" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="495" y="618" font-size="12" font-weight="700" fill="#0038FF">✓ TP=8 张量并行通信开销衰减至忽略不计</text>

    <!-- Col 3: Inter-Node Clos Network -->
    <rect x="850" y="135" width="370" height="525" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/>
    <rect x="850" y="135" width="370" height="4" fill="#0B0D12"/>
    
    <text x="875" y="170" font-size="12" font-weight="700" fill="#0038FF" letter-spacing="1">TIER 3 · INTER-NODE CLOS</text>
    <text x="875" y="200" font-size="20" font-weight="900" fill="#0B0D12">万卡无阻塞 Clos 拓扑网络</text>
    <line x1="875" y1="218" x2="1195" y2="218" stroke="#DEE2E6" stroke-width="1"/>

    <!-- Key Spec Callout -->
    <rect x="875" y="235" width="320" height="75" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="895" y="265" font-size="11" font-weight="700" fill="#6C757D">NETWORK UPLINK PER NODE</text>
    <text x="895" y="295" font-size="28" font-weight="900" fill="#0B0D12">8×800G</text>
    <text x="1035" y="295" font-size="12" fill="#0038FF" font-weight="700">· 轨道优化直连</text>

    <!-- Point 1 -->
    <text x="875" y="340" font-size="15" font-weight="700" fill="#0B0D12">1. Rail-Optimized 轨道优化设计</text>
    <text x="875" y="365" font-size="13" fill="#495057">单机 8 卡严格对齐 8 个独立 Leaf 交换机平面，<tspan x="875" dy="23">彻底消除跨平面冲突，实现跨机 All-to-All 无拥塞。</tspan></text>

    <!-- Point 2 -->
    <text x="875" y="430" font-size="15" font-weight="700" fill="#0B0D12">2. GPUDirect RDMA 零拷贝传输</text>
    <text x="875" y="455" font-size="13" fill="#495057">网卡直接读写远程 GPU 显存，跳过 Host CPU 内存，<tspan x="875" dy="23">端到端传输延迟控制在 1.2μs 以内。</tspan></text>

    <!-- Point 3 -->
    <text x="875" y="520" font-size="15" font-weight="700" fill="#0B0D12">3. NCCL 拓扑自适应优化算法</text>
    <text x="875" y="545" font-size="13" fill="#495057">自动识别机内环与机间树形网络，<tspan x="875" dy="20">通信与计算实现完美隐藏重叠。</tspan></text>

    <rect x="875" y="590" width="320" height="45" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1"/>
    <text x="890" y="618" font-size="12" font-weight="700" fill="#0038FF">✓ 支撑 16,384 卡超大规模线性集群扩展</text>
  </g>

  <!-- Bottom Global Status -->
  <g id="system-footer" data-pptx-bounds="60 680 1160 30" data-pptx-role="decoration">
    <line x1="60" y1="685" x2="1220" y2="685" stroke="#DEE2E6" stroke-width="1"/>
    <text x="60" y="703" font-size="11" fill="#6C757D">ENTERPRISE LARGE MODEL COMPUTING PLATFORM DELIVERY REPORT</text>
    <text x="1220" y="703" font-size="11" font-weight="700" fill="#0B0D12" text-anchor="end">02 / 09</text>
  </g>
</svg>
