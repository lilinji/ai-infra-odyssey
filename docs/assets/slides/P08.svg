<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', Helvetica, 'PingFang SC', sans-serif" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFF"/><g id="system-header" data-pptx-bounds="60 20 1160 30" data-pptx-role="decoration"><line x1="60" x2="1220" y1="45" y2="45" stroke="#DEE2E6" stroke-width="1"/><text x="60" y="35" fill="#0038FF" font-size="11" font-weight="700" letter-spacing="1">07 / CLOUD-NATIVE ORCHESTRATION</text><text x="315" y="35" fill="#6C757D" font-size="11">|</text><text x="330" y="35" fill="#0B0D12" font-size="11" font-weight="700">云原生调度与高可用自愈</text><text x="1220" y="35" fill="#6C757D" font-size="11" font-weight="700" text-anchor="end">GANG SCHEDULING &amp; 100S RECOVERY</text></g><g id="title-block" data-pptx-bounds="60 55 1160 70"><text x="60" y="85" fill="#0B0D12" font-size="28" font-weight="900">云原生调度中枢：动态配额与百秒自愈体系</text><text x="60" y="112" fill="#495057" font-size="14">以 Gang 调度防死锁与 HAMi 硬隔离保障多租户公平，结合 3FS 高性能存储实现 100s 级 XID 故障全自动无感自愈</text></g><g id="four-quadrants" data-pptx-bounds="60 135 1160 525"><rect width="565" height="250" x="60" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="565" height="4" x="60" y="135" fill="#0038FF"/><text x="85" y="165" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">SCHEDULING 01 · DEADLOCK PREVENTION</text><text x="85" y="195" fill="#0B0D12" font-size="18" font-weight="900">拓扑感知与 Gang 防死锁调度中枢</text><line x1="85" x2="600" y1="210" y2="210" stroke="#DEE2E6" stroke-width="1"/><text x="85" y="235" fill="#495057" font-size="13">• K8s DRA 硬件拓扑感知：精确对齐 NVLink 域与 Rail 交换机平面；<tspan x="85" dy="21">• Gang 调度原语 (All-or-Nothing)：作业全量就绪才触发分配，彻底根除死锁；</tspan><tspan x="85" dy="21">• Kueue 弹性配额借还：多租户空闲资源动态超分流转，提升 35% 集群总周转率。</tspan></text><text x="85" y="320" fill="#0038FF" font-size="12" font-weight="700">✓ 万卡作业排队零阻塞，分布式训练 Pod 启停一致性 100%</text><rect width="565" height="250" x="655" y="135" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="565" height="4" x="655" y="135" fill="#0B0D12"/><text x="680" y="165" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">ISOLATION 02 · HARDWARE SLICING</text><text x="680" y="195" fill="#0B0D12" font-size="18" font-weight="900">HAMi 显存硬隔离与双优先级 QoS</text><line x1="680" x2="1195" y1="210" y2="210" stroke="#DEE2E6" stroke-width="1"/><text x="680" y="235" fill="#495057" font-size="13">• 驱动级显存硬隔离：彻底杜绝多租户容器间显存 OOM 相互穿透雪崩；<tspan x="680" dy="21">• 动态微算力切分：轻量评估任务与主干训练弹性混部，算力复用率达 88%；</tspan><tspan x="680" dy="21">• 双优先级保障体系：核心基座模型训练任务享有毫秒级抢占与资源保活特权。</tspan></text><text x="680" y="320" fill="#0B0D12" font-size="12" font-weight="700">✓ 消除“邻居干扰 (Noisy Neighbor)”，生产 SLA 严格锁定</text><rect width="565" height="250" x="60" y="410" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="565" height="4" x="60" y="410" fill="#0B0D12"/><text x="85" y="440" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">STORAGE 03 · DISTRIBUTED CHECKPOINTING</text><text x="85" y="470" fill="#0B0D12" font-size="18" font-weight="900">3FS 极速分布式检查点存储底座</text><line x1="85" x2="600" y1="485" y2="485" stroke="#DEE2E6" stroke-width="1"/><text x="85" y="510" fill="#495057" font-size="13">• 瞬时百 GB 写入：支持 70B/405B 模型权重与优化器状态秒级无阻塞落盘；<tspan x="85" dy="21">• 零元数据瓶颈架构：万卡节点并行并发读取 Checkpoint，无 I/O 排队阻塞；</tspan><tspan x="85" dy="21">• 存储与计算彻底解耦：算力节点故障不丢失任何状态，为秒级自愈筑牢防线。</tspan></text><text x="85" y="595" fill="#0B0D12" font-size="12" font-weight="700">✓ Checkpoint 保存耗时从数十分钟压缩至 65 秒以内</text><rect width="565" height="250" x="655" y="410" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1"/><rect width="565" height="4" x="655" y="410" fill="#0038FF"/><text x="680" y="440" fill="#0038FF" font-size="12" font-weight="700" letter-spacing="1">HIGH AVAILABILITY 04 · FULLY AUTOMATED</text><text x="680" y="470" fill="#0B0D12" font-size="18" font-weight="900">百秒级 XID 故障全自动无感自愈</text><line x1="680" x2="1195" y1="485" y2="485" stroke="#DEE2E6" stroke-width="1"/><text x="680" y="510" fill="#495057" font-size="13">• 秒级异常探测：内核实时捕获 XID 48/63/79 掉卡与落后卡 (3s)；<tspan x="680" dy="21">• 智能隔离与替换：自动隔离不良卡并从温备节点池无感热换 (15s)；</tspan><tspan x="680" dy="21">• 3FS 热加载断点续训：重组通信环并快速加载最新 Checkpoint (65s + 15s)。</tspan></text><text x="680" y="595" fill="#0038FF" font-size="12" font-weight="700">✓ 全流程平均耗时 98 秒，告别 45 分钟人工半夜起夜运维历史</text></g><g id="system-footer" data-pptx-bounds="60 680 1160 30" data-pptx-role="decoration"><line x1="60" x2="1220" y1="685" y2="685" stroke="#DEE2E6" stroke-width="1"/><text x="60" y="703" fill="#6C757D" font-size="11">ENTERPRISE LARGE MODEL COMPUTING PLATFORM DELIVERY REPORT</text><text x="1220" y="703" fill="#0B0D12" font-size="11" font-weight="700" text-anchor="end">08 / 09</text></g></svg>